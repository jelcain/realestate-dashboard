name: 네이버 차단 시험

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install httpx pyyaml python-dotenv
      - run: python scripts/connectivity_probe.py
      - run: python scripts/naver_probe.py
