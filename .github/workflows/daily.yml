name: 일일 수집 (실거래·뉴스)

on:
  # 시간은 UTC (한국 시간 - 9). GitHub 사정으로 몇 분~수십 분 늦을 수 있다
  schedule:
    - cron: "0 20 * * *"   # 05:00 KST: 실거래 + 뉴스
    - cron: "0 2 * * *"    # 11:00 KST: 뉴스
    - cron: "0 8 * * *"    # 17:00 KST: 뉴스
  workflow_dispatch:
    inputs:
      complex:
        description: "네이버 단지번호 (쉼표, 비우면 전체 관심 단지)"
        required: false
        default: ""
      only:
        description: "trade,news 중 일부 (비우면 둘 다)"
        required: false
        default: ""

permissions:
  contents: read
  actions: write   # 아래 keepalive 단계에서 사용

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
      MYBOX_TOKEN: ${{ secrets.MYBOX_TOKEN }}
      PYTHONIOENCODING: utf-8
      TZ: Asia/Seoul   # 날짜(뉴스 날짜, 최근 N개월)를 한국 시간으로 계산
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 수집
        env:
          IN_COMPLEX: ${{ inputs.complex }}
          IN_ONLY: ${{ inputs.only }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # 예약 실행: 05시만 실거래까지, 11·17시는 뉴스만. 늦게 시작해도 뉴스 회차는 예약 시각으로 저장
          case "$SCHEDULE" in
            "0 20 * * *") export NEWS_EDITION=5 ;;
            "0 2 * * *")  export NEWS_EDITION=11; IN_ONLY=news ;;
            "0 8 * * *")  export NEWS_EDITION=17; IN_ONLY=news ;;
          esac
          if [ -z "$MYBOX_TOKEN" ] || [ -z "$MOLIT_SERVICE_KEY" ]; then
            echo "::warning::MYBOX_TOKEN 또는 MOLIT_SERVICE_KEY 시크릿이 없어 수집을 건너뜁니다"
            exit 0
          fi
          ARGS=()
          [ -n "$IN_COMPLEX" ] && ARGS+=(--complex "$IN_COMPLEX")
          [ -n "$IN_ONLY" ] && ARGS+=(--only "$IN_ONLY")
          [ ${#ARGS[@]} -eq 0 ] && ARGS+=(--only trade,news)
          python run_daily.py "${ARGS[@]}"
      - name: 실행 기록
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: logs
          path: logs/
          retention-days: 14
      # 공개 저장소의 예약 실행은 60일간 활동이 없으면 꺼진다 → 매번 다시 켜 둔다
      - name: keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable" || true
